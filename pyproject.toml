[project]
name = "us-extreme-weather-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "xiaoliqiu93", email = "xiaoli93.qiu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13.25",
    "dagster-webserver>=1.13.25",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
]

[project.scripts]
us-extreme-weather-pipeline = "us_extreme_weather_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "us_extreme_weather_pipeline"